# Codespace overrides for backend.yml. The anthropic config doesn't load a local
# inference model, so Ollama only needs room for nomic-embed-text (~270MB).
#
# NOTE ON THE MACHINE SIZE: devcontainer.json declares 4 cores / 16GB, but the
# launcher creates codespaces with `--machine premiumLinux` (8 cores / 32GB),
# and an explicit --machine overrides hostRequirements. The limits below were
# chosen against 16GB and are therefore conservative, not tight — measure on a
# real codespace before treating any of them as a ceiling worth raising.
#
# Used via:
#   docker compose -f .semiont/compose/backend.yml \
#                  -f .devcontainer/docker-compose.codespaces.yml \
#                  --profile observe up -d --wait

# This file states the COMPLETE codespace sizing, not a diff against the base.
# Some entries repeat the base value (gateway, archivist, worker, browser) and
# that repetition is deliberate: the codespace is the memory-constrained target,
# so its numbers are pinned here rather than inherited. Raising a limit in
# backend.yml must not silently raise it on a codespace — change it here too, on
# purpose. Keep every service listed, including ones that happen to match.
#
# Declared totals: ollama 4 + gateway 2 + archivist 2 + librarian 1 + worker 2
# + smelter 1 + weaver 1 + browser 1, plus the telemetry trio at 1g each
# (collector, prometheus, jaeger) = 17g, leaving neo4j, qdrant and postgres
# uncapped. On the 32GB machine the launcher actually requests that is
# comfortable. The archivist is the one to keep roomy: it holds the KB bytes
# and the views.

services:
  ollama:
    mem_limit: 4g
  gateway:
    mem_limit: 2g
  archivist:
    mem_limit: 2g
  librarian:
    mem_limit: 1g
  worker:
    mem_limit: 2g
  smelter:
    mem_limit: 1g
  weaver:
    mem_limit: 1g
  browser:
    mem_limit: 1g
  collector:
    mem_limit: 1g
  prometheus:
    mem_limit: 1g
  jaeger:
    mem_limit: 1g
