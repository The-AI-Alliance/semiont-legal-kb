[user]
name = ""
email = ""

[defaults]
environment = "local"

[environments.local.gateway]
platform = "posix"
port = 4000
publicURL = "http://${GATEWAY_HOST:-localhost}:4000"

[environments.local.jobs]
type = "jetstream"

[environments.local.signal]
type = "nats"

[environments.local.graph]
platform = "container"
type = "neo4j"
name = "neo4j"
username = "neo4j"
database = "neo4j"

[environments.local.vectors]
type = "qdrant"

[environments.local.embedding]
type = "ollama"
model = "nomic-embed-text"

[environments.local.embedding.chunking]
chunkSize = 512
overlap = 64

[environments.local.inference.ollama]
platform = "posix"

[environments.local.actors.gatherer.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.actors.matcher.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.workers.default.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.workers.mark.linking.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.workers.mark.highlighting.inference]
type = "ollama"
model = "gemma4:e2b"

[environments.local.workers.mark.assessing.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.workers.mark.commenting.inference]
type = "ollama"
model = "gemma4:e2b"

[environments.local.workers.mark.tagging.inference]
type = "ollama"
model = "gemma4:e2b"

[environments.local.workers.yield.inference]
type = "ollama"
model = "gemma4:26b"

[environments.local.identity]
type = "keycloak"
subjectClaim = "sub"

[environments.local.database]
platform = "container"
name = "semiont"
user = "postgres"
