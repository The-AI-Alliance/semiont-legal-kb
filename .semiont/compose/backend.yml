# Semiont stack — gateway, archivist, librarian, worker pool, smelter, weaver,
# and browser (http://localhost:3000), plus Neo4j, Qdrant, Ollama, and
# PostgreSQL. Under `--profile observe` it also runs the telemetry trio:
# an OTel collector (every service's export target), Prometheus (scrapes the
# collector's readout on 24110), and Jaeger (traces). Equivalent end state to `semiont start` (the Semiont launcher).
#
# The gateway holds identity, the wire, bytes, and the job queue; it hosts no
# actors. The ARCHIVIST owns the record (Stower accessions it, Browser serves
# browse:* from the projections) and is the ONLY container that mounts the
# knowledge base. The LIBRARIAN owns the two LLM-bound actors, gather and
# search. Keep this file's service set in step with the launcher's roles table
# — they decide the same thing in two places, and nothing fails when they drift.
#
# The seven service images are pulled from GHCR (they ship config-free); the
# selected config TOML is bind-mounted at runtime. Set SEMIONT_VERSION to choose
# an image tag (default: latest). NOTE: relative paths in this file resolve
# against the compose file's directory (.semiont/compose), so SEMIONT_CONFIG is
# given relative to that.
#
# Quick start (ollama-gemma, the default):
#
#   export SEMIONT_WORKER_SECRET=$(openssl rand -hex 32)
#   docker compose -f .semiont/compose/backend.yml up
#   docker compose -f .semiont/compose/backend.yml exec ollama ollama pull nomic-embed-text
#   docker compose -f .semiont/compose/backend.yml exec ollama ollama pull gemma4:26b
#   docker compose -f .semiont/compose/backend.yml exec ollama ollama pull gemma4:e2b
#
# Anthropic config (faster, cloud inference):
#
#   export ANTHROPIC_API_KEY=<your-key>
#   export SEMIONT_CONFIG=../semiontconfig/anthropic.toml
#   export SEMIONT_WORKER_SECRET=$(openssl rand -hex 32)
#   docker compose -f .semiont/compose/backend.yml up
#
# No account is created by bringing the stack up. Make the first admin with
# `semiont useradd --repo <owner>/<name> --email … --admin` (it prompts for the
# password; drop --repo for a local stack), or in-container with `docker compose
# -f .semiont/compose/backend.yml exec gateway semiont-useradd --email …
# --generate-password --admin`. Neither accepts a password as an argument.
#
# Observability (Jaeger sidecar — UI on http://localhost:16686):
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
#   docker compose -f .semiont/compose/backend.yml --profile observe up
#
# Pin/refresh the image version (a bare `up` will not re-pull a cached :latest):
#   export SEMIONT_VERSION=0.5.12
#   docker compose -f .semiont/compose/backend.yml pull
#
# The seven Semiont services carry `restart: on-failure`: any crash is
# restarted (with engine backoff). With semiont-worker >= 0.5.13 this closes a
# self-healing loop for worker stalls — the worker detects processing with no
# activity for 15 min and exits(1), compose restarts it, and the gateway's
# janitor re-queues the held job within 30 min. Infra services deliberately
# have no restart policy: an infra crash usually wants eyes, not a loop.

services:
  neo4j:
    container_name: semiont-neo4j
    image: neo4j:5.26.28-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - semiont_neo4j_data:/data
      - semiont_neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/localpass
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    healthcheck:
      # the neo4j community image has wget but no curl
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    container_name: semiont-qdrant
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
    volumes:
      - semiont_qdrant:/qdrant/storage
    healthcheck:
      # qdrant image is minimal — no curl/wget/nc, but has bash. Port-open
      # check via /dev/tcp; qdrant binds its REST port only after it's ready.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && exec 3<&-'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ollama:
    container_name: semiont-ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    mem_limit: 24g
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # ollama image has neither curl nor wget; use the ollama CLI itself
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    container_name: semiont-postgres
    image: postgres:15.18-alpine
    ports:
      - "5432:5432"
    volumes:
      - semiont_postgres:/var/lib/postgresql/data
    environment:
      # A subdirectory of the mount, not the mount itself: initdb refuses a
      # data directory it does not own outright. Same value the launcher uses.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: semiont
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    container_name: semiont-jaeger
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["observe"]
    ports:
      # 4318 is deliberately NOT published: the collector owns the port every
      # service targets, and Jaeger's OTLP ingest is reached as `jaeger:4318`
      # over the compose network. (The launcher remaps Jaeger to 14318 instead,
      # because there every container shares one host port space.)
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry collector — the single endpoint every service exports to.
  # Without it, traces AND metrics go down one pipe to a traces-only Jaeger and
  # the metrics are silently dropped; that is the bug this service fixes.
  # No healthcheck: the image is distroless (no wget/curl) and nothing
  # depends_on it — a service with no endpoint set simply exports nothing.
  collector:
    container_name: semiont-otel-collector
    image: otel/opentelemetry-collector:0.137.0
    profiles: ["observe"]
    ports:
      - "4318:4318"
      - "24110:24110"
    mem_limit: 1g
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro

  # Prometheus scrapes the collector's readout. 9090 is its product port and is
  # free here only because the internal services moved to the 241xx block.
  prometheus:
    container_name: semiont-prometheus
    image: prom/prometheus:v3.9.1
    profiles: ["observe"]
    ports:
      - "9090:9090"
    mem_limit: 1g
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  gateway:
    container_name: semiont-gateway
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-gateway:${SEMIONT_VERSION:-latest}
    ports:
      - "4000:4000"
    # 2g, as the launcher runs it: the gateway hosts no actors and mounts no
    # knowledge base, so the 8g it carried when it held both is no longer what
    # it needs.
    mem_limit: 2g
    volumes:
      # NO /kb mount: exactly one container touches the knowledge base tree and
      # it is the archivist (SINGLE-KB-MOUNT). The gateway is not the byte path.
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
      - semiont_state:/semiont-state
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XDG_STATE_HOME: /semiont-state
      POSTGRES_HOST: postgres
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      OLLAMA_HOST: ollama
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      # Required by the gateway: it refuses to boot without one (requireJwtSecret
      # in apps/gateway/src/auth/jwt.ts). Guarded like the worker secret so a
      # missing value fails with a fix-it instead of a crash-loop.
      # post-create.sh generates it per codespace; `semiont start` injects it on
      # the local path. The sidecars do NOT need it — they authenticate to the
      # gateway with SEMIONT_WORKER_SECRET and verify no tokens.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (min 32 chars), e.g. export JWT_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Owns the record: accessions events, maintains the projections derived from
  # them, and answers browse:*. The ONLY container that mounts the KB — it holds
  # both the bytes and the views, so the annotation-context read lives here too.
  archivist:
    container_name: semiont-archivist
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-archivist:${SEMIONT_VERSION:-latest}
    ports:
      - "24103:24103"
    mem_limit: 2g
    volumes:
      - ../..:/kb
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
      - semiont_anchored_text:/anchored-text
      - semiont_state:/semiont-state
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_HOST: gateway
      XDG_STATE_HOME: /semiont-state
      OLLAMA_HOST: ollama
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      POSTGRES_HOST: postgres
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      gateway:
        condition: service_healthy

  # Owns the two LLM-bound actors: gather and search. Mounts no KB — it reads
  # the projections through the shared state volume and dials the gateway.
  librarian:
    container_name: semiont-librarian
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-librarian:${SEMIONT_VERSION:-latest}
    ports:
      - "24104:24104"
    mem_limit: 2g
    volumes:
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
      - semiont_state:/semiont-state
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_HOST: gateway
      XDG_STATE_HOME: /semiont-state
      OLLAMA_HOST: ollama
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      POSTGRES_HOST: postgres
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      gateway:
        condition: service_healthy

  worker:
    container_name: semiont-worker
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-worker:${SEMIONT_VERSION:-latest}
    ports:
      - "24100:24100"
    mem_limit: 2g
    volumes:
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_HOST: gateway
      OLLAMA_HOST: ollama
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      POSTGRES_HOST: postgres
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      gateway:
        condition: service_healthy
      archivist:
        condition: service_healthy

  smelter:
    container_name: semiont-smelter
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-smelter:${SEMIONT_VERSION:-latest}
    ports:
      - "24101:24101"
    mem_limit: 2g
    volumes:
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
      - semiont_anchored_text:/anchored-text
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_HOST: gateway
      OLLAMA_HOST: ollama
      QDRANT_HOST: qdrant
      NEO4J_HOST: neo4j
      POSTGRES_HOST: postgres
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      gateway:
        condition: service_healthy

  # The graph projection is standalone-only: the gateway does not apply
  # events to Neo4j in-process. Without this service the graph stays empty
  # and gathers fail at the buildKnowledgeGraph barrier.
  weaver:
    container_name: semiont-weaver
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-weaver:${SEMIONT_VERSION:-latest}
    ports:
      - "24102:24102"
    mem_limit: 3g
    volumes:
      - ${SEMIONT_CONFIG:-../semiontconfig/ollama-gemma.toml}:/home/semiont/.semiontconfig:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_HOST: gateway
      OLLAMA_HOST: ollama
      QDRANT_HOST: qdrant
      NEO4J_HOST: neo4j
      POSTGRES_HOST: postgres
      SEMIONT_WORKER_SECRET: ${SEMIONT_WORKER_SECRET:?SEMIONT_WORKER_SECRET must be set, e.g. export SEMIONT_WORKER_SECRET=$$(openssl rand -hex 32)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      gateway:
        condition: service_healthy

  # Static SPA server (@semiont/browser server.js): no config mount and no
  # service env — the browser talks to the gateway directly on localhost:4000.
  browser:
    container_name: semiont-browser
    restart: on-failure
    image: ghcr.io/the-ai-alliance/semiont-browser:${SEMIONT_VERSION:-latest}
    ports:
      - "3000:3000"
    mem_limit: 1g
    depends_on:
      gateway:
        condition: service_healthy

# Infra state survives `docker compose down`, matching what `semiont start`
# keeps on the host. The graph and the vectors are projections and could be
# rebuilt from the event log, but PostgreSQL holds the USERS — and accounts are
# not derived from the event log, nothing auto-creates one, so without this the
# first admin disappears on every down/up cycle.
volumes:
  ollama_models:
  semiont_neo4j_data:
  semiont_neo4j_logs:
  semiont_qdrant:
  semiont_postgres:
  # Shared by gateway + archivist + librarian (XDG_STATE_HOME).
  semiont_state:
  # Written by the smelter, read by the archivist.
  semiont_anchored_text:
